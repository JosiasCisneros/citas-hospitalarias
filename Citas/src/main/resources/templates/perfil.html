<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil · Citas hospitalarias</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/paciente.css}">
</head>
<body class="app-shell">
    <header th:replace="~{fragments/layout :: header('perfil')}"></header>
    <main id="contenido" class="contenedor recorrido-paciente" tabindex="-1">
        <div class="cabecera-pagina"><div><h1>Mi perfil</h1><p class="texto-secundario">Gestiona tus datos personales y de acceso.</p></div></div>
        <section class="panel perfil-panel" aria-label="Datos de la cuenta">
            <p class="mensaje exito" role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
            <p class="mensaje error" role="alert" th:if="${error}" th:text="${error}"></p>
            <form th:action="@{/perfil}" method="post" th:object="${usuario}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <fieldset><legend>Datos personales</legend><div class="campos-perfil">
                    <div class="campo"><label for="nombre">Nombre</label><input type="text" id="nombre" th:field="*{nombre}" maxlength="255" autocomplete="name" required></div>
                    <div class="campo"><label for="cedula">Cédula</label><input type="text" id="cedula" th:field="*{cedula}" maxlength="255" inputmode="numeric" placeholder="D-DDDD-DDDD" required></div>
                    <div class="campo campo-ancho"><label for="correo">Correo electrónico</label><input type="email" id="correo" th:field="*{correo}" maxlength="255" autocomplete="email" required></div>
                    <div class="campo campo-ancho"><label for="contacto">Contacto <span class="texto-secundario">(opcional)</span></label><input type="text" id="contacto" th:field="*{contacto}" maxlength="255"></div>
                </div></fieldset>
                <fieldset><legend>Contraseña</legend><div class="campo">
                    <label for="nuevaPassword">Nueva contraseña <span class="texto-secundario">(opcional)</span></label><input type="password" id="nuevaPassword" name="nuevaPassword" autocomplete="new-password">
                </div></fieldset>
                <div class="acciones-perfil"><button type="submit">Guardar cambios</button><a class="boton-secundario" th:href="@{/inicio}">Volver al inicio</a></div>
            </form>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
