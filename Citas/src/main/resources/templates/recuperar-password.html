<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña · Citas hospitalarias</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body th:classappend="${#authorization.expression('isAuthenticated()') ? 'app-shell' : 'public-shell'}">
    <header th:replace="~{fragments/layout :: header('recuperar')}"></header>
    <main id="contenido" class="acceso-main recuperacion-main" tabindex="-1">
        <section class="recuperacion-panel" aria-labelledby="titulo-acceso">
            <a class="enlace-volver" th:href="@{/login}">← Volver a iniciar sesión</a>
            <span class="ceja">Recupera el acceso</span>
            <h1 id="titulo-acceso">¿Olvidaste tu contraseña?</h1>
            <p class="texto-secundario">Escribe el correo de tu cuenta. Si la solicitud puede atenderse, recibirás instrucciones para crear una nueva contraseña.</p>
            <p class="mensaje error" role="alert" th:if="${error}" th:text="${error}"></p>
            <p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
            <form th:action="@{/recuperar-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" maxlength="255" aria-describedby="ayuda-correo" required>
                    <p class="ayuda" id="ayuda-correo">Por privacidad, la respuesta no confirma si existe una cuenta con ese correo.</p>
                </div>
                <button type="submit">Solicitar recuperación</button>
            </form>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
