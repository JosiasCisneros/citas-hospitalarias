<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes · Citas hospitalarias</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/administracion.css}">
</head>
<body class="app-shell">
    <header th:replace="~{fragments/layout :: header('reportes')}"></header>
    <main id="contenido" class="contenedor administracion" tabindex="-1">
        <div class="cabecera-admin"><div><h1>Reportes de citas</h1></div><a class="boton" th:href="@{/admin/reportes/csv(fechaDesde=${fechaDesde},fechaHasta=${fechaHasta},medicoId=${medicoId},especialidad=${especialidad},estado=${estado})}">Exportar CSV</a></div>
        <p class="mensaje error" role="alert" th:if="${error}" th:text="${error}"></p>
        <form th:replace="~{fragments/administracion :: filtros('/admin/reportes',true)}"></form>
        <dl class="totales-reporte" aria-label="Totales de las citas filtradas"><div><dt>Total</dt><dd th:text="${totalCitas}"></dd></div><div><dt>Pendientes</dt><dd th:text="${pendientes}"></dd></div><div><dt>Confirmadas</dt><dd th:text="${confirmadas}"></dd></div><div><dt>Canceladas</dt><dd th:text="${canceladas}"></dd></div></dl>
        <section class="vacio-admin" th:if="${#lists.isEmpty(citas)}"><h2>Sin resultados</h2><p>No se encontraron citas con los filtros seleccionados.</p><a th:href="@{/admin/reportes}">Limpiar filtros</a></section>
        <div class="tabla-contenedor" th:unless="${#lists.isEmpty(citas)}" role="region" aria-label="Resultados del reporte de citas" tabindex="0">
            <table class="tabla-admin"><caption class="solo-lectores">Citas filtradas incluidas en la exportación CSV completa.</caption><thead><tr><th scope="col">Paciente</th><th scope="col">Médico</th><th scope="col">Especialidad</th><th scope="col">Fecha</th><th scope="col">Horario</th><th scope="col">Estado</th></tr></thead><tbody>
                <tr th:each="cita : ${citas}"><td th:text="${cita.usuario.nombre}"></td><td th:text="${cita.medico.nombre}"></td><td th:text="${cita.medico.especialidad}"></td><td class="celda-fecha" th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td><td class="celda-hora" th:text="${#temporals.format(cita.horaInicio, 'HH:mm') + ' – ' + #temporals.format(cita.horaFin, 'HH:mm')}"></td><td><span th:replace="~{fragments/administracion :: estado(${cita.estado})}"></span></td></tr>
            </tbody></table>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
