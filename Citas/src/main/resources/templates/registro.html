<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta · Citas hospitalarias</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body th:classappend="${#authorization.expression('isAuthenticated()') ? 'app-shell' : 'public-shell'}">
    <header th:replace="~{fragments/layout :: header('registro')}"></header>
    <main id="contenido" class="acceso-main" tabindex="-1">
        <div class="acceso">
            <aside th:replace="~{fragments/layout :: editorial}"></aside>
            <section class="acceso-formulario" aria-labelledby="titulo-acceso">
                <h1 id="titulo-acceso">Crear cuenta</h1>
                <p class="mensaje error" role="alert" th:if="${error}" th:text="${error}"></p>
                <form th:action="@{/registro}" th:object="${usuario}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="campos-registro">
                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" autocomplete="name" maxlength="255" required>
                        </div>
                        <div class="campo">
                            <label for="cedula">Cédula</label>
                            <input type="text" id="cedula" th:field="*{cedula}" maxlength="255" inputmode="numeric" placeholder="D-DDDD-DDDD" pattern="[ ]*([0-9]{9}|[0-9]-[0-9]{4}-[0-9]{4})[ ]*" required>
                        </div>
                        <div class="campo campo-ancho">
                            <label for="correo">Correo electrónico</label>
                            <input type="email" id="correo" th:field="*{correo}" autocomplete="email" maxlength="255" required>
                        </div>
                        <div class="campo campo-ancho">
                            <label for="contacto">Contacto <span class="texto-secundario">(opcional)</span></label>
                            <input type="text" id="contacto" th:field="*{contacto}" maxlength="255">
                        </div>
                        <div class="campo campo-ancho">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" autocomplete="new-password" maxlength="72" required>
                        </div>
                    </div>
                    <button type="submit">Crear cuenta</button>
                </form>
                <div class="links"><a th:href="@{/login}">Iniciar sesión</a></div>
            </section>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
