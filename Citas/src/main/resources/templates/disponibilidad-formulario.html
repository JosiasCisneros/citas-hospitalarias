<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilidad · Citas hospitalarias</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/administracion.css}">
</head>
<body class="app-shell">
    <header th:replace="~{fragments/layout :: header('disponibilidades')}"></header>
    <main id="contenido" class="contenedor administracion" tabindex="-1">
        <div class="cabecera-admin"><h1 th:text="${titulo}">Disponibilidad</h1></div><section class="panel formulario-admin" aria-label="Horario del médico">
        <p class="mensaje error" role="alert" th:if="${error}" th:text="${error}"></p>
            <form th:if="${disponibilidad.id == null}" th:action="@{/disponibilidades/guardar}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="campo"><label for="medicoId">Médico</label><select id="medicoId" name="medicoId" required><option value="">Selecciona un médico</option><option th:each="medico : ${medicos}" th:value="${medico.id}" th:text="${medico.nombre + ' · ' + medico.especialidad}"></option></select></div><div class="campo"><label for="fecha">Fecha</label><input type="date" id="fecha" name="fecha" th:value="${disponibilidad.fecha}" required></div><div class="campos-cortos"><div class="campo"><label for="horaInicio">Hora inicio</label><input type="time" step="60" id="horaInicio" name="horaInicio" th:value="${disponibilidad.horaInicio}" required></div><div class="campo"><label for="horaFin">Hora fin</label><input type="time" step="60" id="horaFin" name="horaFin" th:value="${disponibilidad.horaFin}" required></div></div><div class="acciones-formulario"><button type="submit">Guardar</button><a class="boton-secundario" th:href="@{/disponibilidades}">Volver a disponibilidades</a></div></form>
            <form th:if="${disponibilidad.id != null}" th:action="@{/disponibilidades/editar/{id}(id=${disponibilidad.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><dl class="dato-solo-lectura"><dt>Médico</dt><dd th:text="${disponibilidad.medico.nombre + ' · ' + disponibilidad.medico.especialidad}"></dd></dl><div class="campo"><label for="fechaEditar">Fecha</label><input type="date" id="fechaEditar" name="fecha" th:value="${disponibilidad.fecha}" required></div><div class="campos-cortos"><div class="campo"><label for="horaInicioEditar">Hora inicio</label><input type="time" step="60" id="horaInicioEditar" name="horaInicio" th:value="${disponibilidad.horaInicio}" required></div><div class="campo"><label for="horaFinEditar">Hora fin</label><input type="time" step="60" id="horaFinEditar" name="horaFin" th:value="${disponibilidad.horaFin}" required></div></div><div class="acciones-formulario"><button type="submit">Guardar</button><a class="boton-secundario" th:href="@{/disponibilidades}">Volver a disponibilidades</a></div></form>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
